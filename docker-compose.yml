services:
  app:
    build: .
    env_file: .env
    command: uvicorn flight_deals.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - flight-data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/flight_deals.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  flight-data:
