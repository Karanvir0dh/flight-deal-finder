[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-deal-finder"
version = "0.1.0"
description = "Quota-aware Toronto flight deal discovery and alerting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hamza"}]
dependencies = [
  "alembic==1.13.2",
  "click==8.1.7",
  "fastapi==0.115.0",
  "httpx==0.27.2",
  "jinja2==3.1.4",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "sqlalchemy==2.0.32",
  "tenacity==8.5.0",
  "typer==0.12.5",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "mypy==1.11.2",
  "pytest==8.3.2",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.3",
  "types-PyYAML==6.0.12.20250822",
]

[project.scripts]
flight-deals = "flight_deals.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flight_deals = ["templates/*.html", "templates/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
